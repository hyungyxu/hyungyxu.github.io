<!doctype html><html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" /><title>매일 배우기 · hyungyxu</title><link rel="stylesheet" href="detail.css" /></head><body><main class="wrap"><a class="back" href="index.html">← 메인으로 돌아가기</a><section class="hero"><div class="emoji">🌱</div><span class="tag">LEARNING EVERY DAY</span><h1>작은 배움이<br />매일 자랍니다.</h1><p class="lead">완벽하게 시작하지 않아도 괜찮다고 믿어요. 오늘의 작은 시도가 내일의 더 큰 자신감이 됩니다.</p></section><section class="panel"><h2>배움의 방식</h2><ul class="list"><li><strong>작게 시작하기</strong>어려운 목표도 아주 작은 한 단계로 나누어 시작합니다.</li><li><strong>직접 만들어 보기</strong>눈으로만 보지 않고 손으로 만들어 보며 이해합니다.</li><li><strong>질문을 남기기</strong>모르는 것을 발견하면 다음에 알아볼 주제로 기록합니다.</li></ul></section><footer>🍊 hyungyxu · Tangerine Days</footer></main></body></html>
